server.port=3002
server.servlet.context-path=/api
spring.application.name=gig-service

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=${EUREKA_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=jdbc:postgresql://localhost:5433/skillbridge?currentSchema=gigs&stringtype=unspecified
spring.datasource.username=skillbridge
spring.datasource.password=skillbridge123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=gigs
spring.jpa.properties.hibernate.default_batch_fetch_size=20

spring.jackson.serialization.write-dates-as-timestamps=false

spring.sql.init.mode=always

gateway.internal-secret=${GATEWAY_INTERNAL_SECRET:skillbridge-dev-gateway-secret}
gateway.security.enabled=${GATEWAY_SECURITY_ENABLED:true}
gateway.security.allow-shared-secret=${GATEWAY_SECURITY_ALLOW_SHARED_SECRET:true}
gateway.signature.gateway-id=${GATEWAY_SIGNATURE_GATEWAY_ID:api-gateway}
gateway.signature.public-key=${GATEWAY_SIGNATURE_PUBLIC_KEY:}

# ── RabbitMQ ─────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:skillbridge}
spring.rabbitmq.password=${RABBITMQ_PASS:skillbridge}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
