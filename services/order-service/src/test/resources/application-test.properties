spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=orders
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
eureka.client.enabled=false
gateway.internal-secret=test-gateway-secret
gateway.security.enabled=false

# Fast timeouts for tests (no real network calls)
rest.client.connect-timeout-ms=1000
rest.client.read-timeout-ms=1000

# Circuit breaker: require 100 calls before it can open — effectively disabled in tests.
# Without this a failed test can leave the circuit OPEN and break subsequent tests.
resilience4j.circuitbreaker.instances.gigService.minimum-number-of-calls=100
resilience4j.circuitbreaker.instances.gigService.sliding-window-size=100
resilience4j.retry.instances.gigService.max-attempts=1
