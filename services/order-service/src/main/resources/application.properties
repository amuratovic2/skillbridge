properties
server.port=3003
server.servlet.context-path=/api
spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5433/skillbridge?currentSchema=orders&stringtype=unspecified
spring.datasource.username=skillbridge
spring.datasource.password=skillbridge123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=orders
spring.jpa.properties.hibernate.default_batch_fetch_size=20

spring.jackson.serialization.write-dates-as-timestamps=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always