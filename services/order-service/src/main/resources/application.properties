server.port=3003
server.servlet.context-path=/api
spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5433/skillbridge?currentSchema=orders&stringtype=unspecified
spring.datasource.username=skillbridge
spring.datasource.password=skillbridge123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=orders
spring.jpa.properties.hibernate.default_batch_fetch_size=20

spring.jackson.serialization.write-dates-as-timestamps=false

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always

# HTTP client tuning (RestTemplateConfig reads these values)
rest.client.connect-timeout-ms=3000
rest.client.read-timeout-ms=5000
rest.client.max-connections=50
rest.client.max-connections-per-route=20

# ── Retry ───────────────────────────────────────────────────────────────────
# Retry up to 2 extra times on transient failures (ResourceAccessException,
# HttpServerErrorException) before counting the call as a circuit-breaker failure.
# This absorbs momentary network hiccups without opening the circuit.
resilience4j.retry.instances.gigService.max-attempts=3
resilience4j.retry.instances.gigService.wait-duration=500ms
resilience4j.retry.instances.gigService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.gigService.ignore-exceptions=org.springframework.web.server.ResponseStatusException

# ── Circuit Breaker ──────────────────────────────────────────────────────────
# Opens when failure rate exceeds 50% in a window of 10 calls (min 5 required).
# A window of 10 with a min of 5 is realistic: one bad call can't open the circuit.
resilience4j.circuitbreaker.instances.gigService.sliding-window-size=10
resilience4j.circuitbreaker.instances.gigService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.gigService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gigService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.gigService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gigService.automatic-transition-from-open-to-half-open-enabled=true
# Only connection/timeout failures and 5xx errors open the circuit; 404 is business logic
resilience4j.circuitbreaker.instances.gigService.record-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.gigService.ignore-exceptions=org.springframework.web.server.ResponseStatusException
resilience4j.circuitbreaker.instances.gigService.register-health-indicator=true