server:
  port: 3000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - SecureHeaders
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Auth routes (no JWT validation needed)
        - id: auth-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**

        # User service routes
        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/portfolios/**,/api/skills/**

        # Gig service routes
        - id: gig-service
          uri: lb://gig-service
          predicates:
            - Path=/api/gigs/**,/api/categories/**,/api/tags/**

        # Order service routes
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**,/api/deliveries/**,/api/custom-offers/**

        # Communication service routes
        - id: communication-diagnostics
          uri: lb://communication-service
          predicates:
            - Path=/api/diagnostics/**

        - id: communication-service
          uri: lb://communication-service
          predicates:
            - Path=/api/messages/**,/api/reviews/**,/api/disputes/**,/api/notifications/**

services:
  user-service-url: http://localhost:3001

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:skillbridge-dev-gateway-secret}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: ${EUREKA_ENABLED:true}
    fetch-registry: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
