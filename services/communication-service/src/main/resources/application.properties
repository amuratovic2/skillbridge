server.port=3004
server.servlet.context-path=/api
spring.application.name=communication-service

spring.datasource.url=jdbc:postgresql://localhost:5433/skillbridge?currentSchema=communication
spring.datasource.username=skillbridge
spring.datasource.password=skillbridge123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=communication

spring.sql.init.mode=always

gateway.internal-secret=${GATEWAY_INTERNAL_SECRET:skillbridge-dev-gateway-secret}
gateway.security.enabled=${GATEWAY_SECURITY_ENABLED:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=${EUREKA_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

communication.user-validation.enabled=true
communication.user-service.connect-timeout-ms=1000
communication.user-service.read-timeout-ms=1500
